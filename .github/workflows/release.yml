name: Release

# 打 tag（v1.0.0 这种）即自动构建 + 发布到 GitHub Releases。
# 发布内容：batteryhub.exe + SHA256SUMS.txt；发布说明默认从提交自动生成，
# 之后可用 `gh release edit <tag> --notes-file <文件>` 换成手写说明。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 ${{ github.ref_name }}
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: 缓存 cargo 依赖与构建产物
        uses: Swatinem/rust-cache@v2

      - name: 校验 tag 与 Cargo.toml 版本一致
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $meta = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $app = $meta.packages | Where-Object { $_.name -eq 'bh-app' }
          if (-not $app) { throw '未找到 bh-app 包' }
          Write-Host "tag=$tag, bh-app=$($app.version)"
          if ($app.version -ne $tag) { throw "版本不一致：tag 是 $tag，Cargo.toml 是 $($app.version)" }

      - name: 行数门禁
        shell: pwsh
        run: ./tools/check-size.ps1

      - name: 构建 release
        run: cargo build --locked --release

      # 发布前必须确认 exe 真的带着图标/版本信息/清单，否则下载页又是一个“白窗图标”的 exe。
      - name: 资源门禁（图标 / 版本信息 / 应用清单）
        shell: pwsh
        run: ./tools/check-exe.ps1 ./target/release/batteryhub.exe

      - name: 无界面自检
        shell: pwsh
        run: ./target/release/batteryhub.exe --self-test

      - name: 生成 SHA256SUMS.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/batteryhub.exe -Algorithm SHA256).Hash.ToLower()
          "batteryhub.exe  $hash" | Out-File -FilePath target/release/SHA256SUMS.txt -Encoding ascii
          Get-Content target/release/SHA256SUMS.txt

      # 发布物必须带上第三方许可声明，否则 MIT / Apache-2.0 / BSD-3 的告知义务没履行。
      - name: 第三方许可清单未过期
        shell: pwsh
        run: ./tools/gen-notices.ps1 -Check

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: BatteryHub ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/batteryhub.exe
            target/release/SHA256SUMS.txt
            THIRD-PARTY-NOTICES.txt
            LICENSE

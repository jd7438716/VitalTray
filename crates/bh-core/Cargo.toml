[package]
name = "bh-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bh-api.workspace = true
bh-hid = { path = "../bh-hid" }
bh-proto-logitech = { path = "../bh-proto-logitech" }
bh-proto-rapoo = { path = "../bh-proto-rapoo" }
bh-proto-razer = { path = "../bh-proto-razer" }
bh-plugin-mouse = { path = "../../plugins/bh-plugin-mouse" }
bh-plugin-keyboard = { path = "../../plugins/bh-plugin-keyboard" }
bh-plugin-laptop = { path = "../../plugins/bh-plugin-laptop" }
bh-plugin-bluetooth = { path = "../../plugins/bh-plugin-bluetooth" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_UI_Input_KeyboardAndMouse",
] }
